spring:
  application:
    name: erp-ai-assistant

  # 本地开发默认启用 local profile → 自动加载 application-local.yml
  # （该文件放本机凭据，已在 .gitignore 中，不进仓库）。
  #
  # 用 default 而不是 active：default 只在**未显式指定** profile 时生效。
  # 将来 CI / 生产用 --spring.profiles.active=prod 启动时，本项自动让位，
  # 不会把本机配置带到部署环境里去。若写死 active，那个赋值永远优先，反而不好收场。
  profiles:
    default: local

  # RabbitMQ：文档「上传 → 解析 → 向量化」异步化
  rabbitmq:
    host: ${ERP_MQ_HOST:localhost}
    port: ${ERP_MQ_PORT:5672}
    username: ${ERP_MQ_USER:erp}
    password: ${ERP_MQ_PASSWORD:123456}
    listener:
      simple:
        # 必须设 false：默认 true 时，消费抛异常的消息会被立刻重新入队，
        # 形成「失败→重投→再失败」的热循环，把日志刷爆且挡住后续消息。
        # 关掉后失败消息走死信队列，由拓扑里的 DLQ 配置承接。
        default-requeue-rejected: false

  datasource:
    url: jdbc:postgresql://localhost:5432/erp_ai
    username: ${ERP_DB_USER:duduke}
    password: ${ERP_DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: erp-hikari
      maximum-pool-size: 20
      minimum-idle: 5

  # ===== 数据库迁移 =====
  # 依赖上必须用 spring-boot-starter-flyway（Boot 4 起 Flyway 自动配置已拆为独立模块）
  # + flyway-database-postgresql（Flyway 10+ 把数据库支持拆成单独模块）。
  # 只引 flyway-core 时迁移会完全不执行，且启动日志没有任何 Flyway 输出。
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 存量库兼容：此前的表由手工脚本 + Java 初始化器创建，没有 flyway_schema_history。
    # Flyway 遇到「schema 非空但无历史表」会直接报错，故开启 baseline 且版本设为 0，
    # 使 V1 起全部脚本正常执行（V1/V2 用 IF NOT EXISTS、V3 用 ON CONFLICT，对存量库安全）。
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 550MB

  ai:
    # 统一 OpenAI 兼容协议。默认指向通义千问 DashScope（chat + embedding 同源）。
    # 真实密钥放在 application-local.yml（已 gitignore），用 --spring.profiles.active=local 激活。
    openai:
      api-key: ${DASHSCOPE_API_KEY:sk-placeholder}
      # 必须带 /v1。Spring AI 2.0 使用 OpenAI 官方 SDK，其 base-url 语义为
      # 「含 /v1 的根路径」，不会再自动补 /v1。
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        options:
          # deepseek-v4-pro-0813：百炼上的 DeepSeek 旗舰推理模型。
          # 与原来一样走同一个 base-url 与同一个 DASHSCOPE_API_KEY（百炼的模型 ID），
          # 所以 base-url、Key、embedding 都不需要跟着改，向量也不必重建
          # （模型指纹只对 embedding 生效）。
          # 注意它是**推理模型**：支持 Function Calling，但思考模式会额外消耗 token。
          model: deepseek-v4-pro-0813
      embedding:
        options:
          model: text-embedding-v4
          # MRL 降维到 1024 维：pgvector HNSW 索引列上限 2000 维，
          # 且此值必须与 vectorstore.pgvector.dimensions 严格一致
          dimensions: 1024

    # 模型 API 调用重试
    retry:
      max-attempts: 3

    vectorstore:
      pgvector:
        index-type: hnsw
        distance-type: cosine_distance
        # 必须与 embedding 输出维度一致，否则启动即报错
        dimensions: 1024
        initialize-schema: true

app:
  # 多租户列名；MyBatis-Plus 租户插件自动追加该列条件
  tenant:
    column: ent_code
    # 全局配置表（无 ent_code 语义）与租户主表，必须跳过租户条件注入。
    # tenant 本身有 ent_code 字段，但查询它时尚未建立租户上下文，故一并跳过，
    # 由业务 SQL 自行带上 ent_code 条件。
    ignore-tables:
      - billing_plan
      - billing_price_rule
      - llm_tool
      - tenant

  # 可用模型列表已收敛为单模型：
  # 原本规划的 DeepSeek / Qwen 多模型路由（ModelRegistry + AssistantClientProvider
  # 按 provider 缓存 ChatClient）已舍弃——只有一套 OpenAI 兼容配置时，
  # 多 provider 缓存是无用复杂度。模型由 spring.ai.openai.chat.options.model 指定。
  # 后续如需切换模型，改这里的 model 值即可，编排代码不受影响。
  # 对象存储（RustFS，S3 兼容）
  storage:
    # 是 S3 端口 9000，不是控制台端口 9001
    endpoint: ${ERP_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${ERP_STORAGE_ACCESS_KEY:rustfsadmin}
    secret-key: ${ERP_STORAGE_SECRET_KEY:rustfsadmin}
    # RustFS 不校验区域，但 SigV4 签名必须有值，不能省
    region: us-east-1
    # 知识库文档原件
    bucket: erp-knowledge
    # 预签名上传链接有效期（分钟），短期有效以免转发后长期可用
    presign-valid-minutes: 15

  # 消息队列（业务侧拓扑命名与开关）
  mq:
    document-parse-queue: erp.document.parse
    document-parse-dlq: erp.document.parse.dlq
    document-exchange: erp.document
    document-parse-routing-key: document.parse
    # 消息队列不可用时切回同步解析的开关，避免「上传」整功能不可用
    async-enabled: true
    # 这里不配重试次数：消费失败直接进死信队列，由死信管理端人工重投。
    # 解析失败多为确定性错误，自动重试只是把同一错误重跑多遍（详见 MessagingProperties）。

  chat:
    # 记忆窗口：保留最近 20 条消息（约 10 轮问答）。太小会丢失上下文，
    # 太大会让每轮请求的 token 成本线性上升。20 是参考实现的取值，先沿用。
    memory-window-size: 20
    # 单轮回答上限，0 表示不限制（交由模型默认值）
    max-output-tokens: 0
    title-max-length: 40
    max-question-length: 4000
    max-messages-per-conversation: 500
    # 是否在流式错误事件（StreamError.detail）里回传原始异常摘要。
    # 本地开发开：SSE 只给前端一条通用文案，没有 detail 就得翻服务端日志才能对上账。
    # ⚠️ 生产必须覆盖为 false —— 原始异常可能含表名、SQL 片段、内网地址与文件路径。
    expose-error-detail: true

  # RAG 检索参数
  # 阈值来自 2026-09-13 的实测标定（DashScope text-embedding-v4，1024 维）：
  #   相关提问 top1 分数 0.4278 ~ 0.5558
  #   不相关提问 top1 分数 0.0970 ~ 0.1828
  # 两者之间存在 0.18 ~ 0.43 的空档，阈值落在区间内即可正确切分。
  # 注意：这组值不可跨模型复用——参考实现那套 0.5 / 0.25 是按 384 维本地模型调出的，
  # 直接拿来会把全部相关结果滤掉。换模型后必须重新标定。
  rag:
    # 检索查询改写方式：rule（只用规则式）/ model（规则式补全 + 模型润色）。
    #
    # ⚠️ 2026-09-20 对照实验结论：**保持 rule**。model 无收益、有代价：
    #    43 条 v2 用例实测 —— Recall@5 持平（1.0 → 1.0）；
    #    MRR@5 反而下降 0.0085（0.9359 → 0.9274）；评测耗时 73s → 296s（4 倍）。
    #    推测原因：v2 用例本身都是书面语，而模型润色的价值在于修正**口语化**提问，
    #    评测集与它的适用场景不匹配。
    # 代码与开关都保留：将来若补了口语化评测集，值得重做一次对照再定。
    rewrite-mode: rule
    auto-top-k: 5
    # auto 模式带业务 Tool，知识只是辅助，阈值取偏精度一侧。
    # 取 0.5 是"宁漏勿乱"的取舍：实测相关样本低至 0.4278，因此这一档也会被滤掉——
    # 但 auto 有工具兜底，注入弱相关段落反而会干扰模型使用工具结果（实际发生过：
    # 检索到的无关文档让模型忽略了工具返回的数据，直接答「现有资料无法回答」）。
    # 需要更高召回时用 knowledge 模式（那里阈值偏召回一侧）。
    auto-similarity-threshold: 0.5
    knowledge-top-k: 8
    # knowledge 模式纯知识问答，召回优先，阈值取偏召回一侧
    knowledge-similarity-threshold: 0.25
    # 过采样倍数：先取 topK*n 再做资格过滤与去重分散，上限 24
    oversample-factor: 3
    oversample-max: 24

    # 向量身份契约。embedding-model 会写入每个向量的元数据并在检索时强制比对，
    # 换模型后旧向量自动失效；embedding-dimensions 必须与 pgvector 表结构一致。
    embedding-model: dashscope/text-embedding-v4@1024
    embedding-dimensions: 1024
    embedding-max-tokens: 8192

    # 分块：上限 8192 给了很大余量。600 太粗——中文约合 600~900 字，
    # 一个向量会混入多个主题导致召回无区分度；300 更接近 RAG 常用粒度（200~500 token）。
    chunk-size: 300
    min-chunk-size-chars: 100
    min-chunk-length-to-embed: 30
    max-num-chunks: 20000

    max-extracted-chars: 5000000
    # 批量写入向量库的批大小。
    # ⚠️ 这不是性能参数，而是**由 embedding provider 的批量上限决定**：
    #   DashScope 单次最多 10 条文本，超出直接 400
    #   （InvalidParameter: batch size is invalid, it should not be larger than 10）；
    #   OpenAI 可到 2048。**换 provider 必须同步改这个值。**
    vector-write-batch-size: 10

# Sa-Token 配置
sa-token:
  token-name: satoken
  # 默认 1 天；active-timeout 为无操作有效期，-1 表示不限制
  timeout: 86400
  active-timeout: -1
  # 允许同一账号多地登录
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

server:
  port: 8080
